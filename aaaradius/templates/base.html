<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}AAAradiusPanel{% endblock %}</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
      }
      header {
        background: #111827;
        border-bottom: 1px solid #334155;
        padding: 1rem 1.5rem;
      }
      nav a {
        color: #93c5fd;
        margin-right: 1rem;
        text-decoration: none;
      }
      main {
        padding: 1.5rem;
        max-width: 960px;
        margin: 0 auto;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border-bottom: 1px solid #334155;
        padding: 0.5rem;
        text-align: left;
      }
      input, button, select {
        padding: 0.5rem;
        margin: 0.25rem 0;
      }
      .success { color: #4ade80; }
      .error { color: #f87171; }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 1rem;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>AAAradiusPanel</strong>
      <nav>
        <a href="/">Dashboard</a>
        <a href="/users">Users</a>
        <a href="/clients">NAS Clients</a>
        <a href="/test-auth">Test Auth</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
